name: Actualizar panel

on:
  # Actualizacion cada hora. GitHub puede retrasar o saltarse alguna ejecucion si la cola va cargada.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    concurrency:
      group: panel
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Encuestas
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/encuestas.py

      - name: Fiabilidad de encuestadoras (una vez al dÃ­a)
        continue-on-error: true
        run: |
          if [ ! -f data/fiabilidad.json ] || [ ! -f data/historico_2023.json ] || [ ! -f data/historico_2016.json ] || [ "$(date -u +%H)" = "04" ]; then python scripts/fiabilidad.py; else echo "Se mantiene la del dÃ­a"; fi

      - name: Modelo de probabilidades y anÃ¡lisis de encuestas
        continue-on-error: true
        run: node scripts/simular.js

      - name: Resumen de la maÃ±ana por Telegram (7:00 UTC)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(date -u +%H)" = "07" ]; then python scripts/resumen_diario.py; else echo "No es la hora"; fi

      - name: Noticias y verificaciones
        continue-on-error: true
        run: python scripts/noticias.py

      - name: AtenciÃ³n en Wikipedia (una vez al dÃ­a)
        continue-on-error: true
        run: |
          if [ ! -f data/atencion.json ] || [ "$(date -u +%H)" = "05" ]; then python scripts/atencion.py; else echo "Se mantiene la del dÃ­a"; fi

      - name: Bot de Telegram (porra)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_bot.py

      - name: Guardar datos en el repo
        run: |
          git config user.name "panel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "datos $(date -u +%Y-%m-%dT%H:%M)" && git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
