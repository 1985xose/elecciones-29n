name: Actualizar panel

on:
  # La actualización cada hora la lanza cron-job.org con un token. El cron de GitHub queda de respaldo.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    concurrency:
      group: panel
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # Siempre desde lo último de main. Si esta ejecución ha estado esperando a que acabara otra, así parte ya con los
      # datos que subió la anterior en vez de con los del momento en que se lanzó.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Encuestas (si falla la validación se conservan los datos anteriores y el workflow acaba en rojo)
        id: encuestas
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/encuestas.py

      - name: Fiabilidad de encuestadoras (una vez al día)
        continue-on-error: true
        run: |
          if [ ! -f data/fiabilidad.json ] || [ ! -f data/historico_2023.json ] || [ ! -f data/historico_2016.json ] || [ "$(date -u +%H)" = "04" ]; then python scripts/fiabilidad.py; else echo "Se mantiene la del día"; fi

      - name: Modelo de probabilidades y análisis de encuestas
        continue-on-error: true
        run: node scripts/simular.js

      - name: Resumen de la mañana por Telegram (7:00 UTC)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(date -u +%H)" = "07" ]; then python scripts/resumen_diario.py; else echo "No es la hora"; fi

      - name: Noticias y verificaciones
        continue-on-error: true
        run: python scripts/noticias.py

      - name: Bot de Telegram (porra)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_bot.py

      - name: Guardar datos en el repo
        run: |
          git config user.name "panel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin datos nuevos"; exit 0; fi
          git commit -q -m "datos $(date -u +%Y-%m-%dT%H:%M)"
          if ! git pull --rebase; then
            # Otra ejecución ha subido datos mientras esta trabajaba. Los ficheros de data/ se generan enteros en cada
            # ejecución, así que no se mezclan. Se quedan los de esta, que son los más nuevos, y se sigue.
            echo "Conflicto en los datos, se conservan enteros los de esta ejecución"
            git checkout REBASE_HEAD -- data/
            git add data/
            GIT_EDITOR=true git rebase --continue
          fi
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Marcar en rojo si las encuestas no pasaron la validación
        if: steps.encuestas.outcome == 'failure'
        run: |
          echo "La lectura de encuestas falló la validación. La web sigue publicada con los datos anteriores. Revisa el paso Encuestas."
          exit 1
