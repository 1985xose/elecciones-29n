name: Actualizar panel

on:
  # El cron de GitHub se salta ejecuciones cuando va cargado, así que estas horas son solo la red de seguridad.
  # La cadena real la mantiene el último paso, que vuelve a lanzar este workflow pasados 55 minutos.
  schedule:
    - cron: "17 5,8,11,14,17,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    concurrency:
      group: panel
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Encuestas (si falla la validación se conservan los datos anteriores y el workflow acaba en rojo)
        id: encuestas
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/encuestas.py

      - name: Fiabilidad de encuestadoras (una vez al día)
        continue-on-error: true
        run: |
          if [ ! -f data/fiabilidad.json ] || [ ! -f data/historico_2023.json ] || [ ! -f data/historico_2016.json ] || [ "$(date -u +%H)" = "04" ]; then python scripts/fiabilidad.py; else echo "Se mantiene la del día"; fi

      - name: Modelo de probabilidades y análisis de encuestas
        continue-on-error: true
        run: node scripts/simular.js

      - name: Resumen de la mañana por Telegram (7:00 UTC)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(date -u +%H)" = "07" ]; then python scripts/resumen_diario.py; else echo "No es la hora"; fi

      - name: Noticias y verificaciones
        continue-on-error: true
        run: python scripts/noticias.py

      - name: Atención en Wikipedia (una vez al día)
        continue-on-error: true
        run: |
          if [ ! -f data/atencion.json ] || [ "$(date -u +%H)" = "05" ]; then python scripts/atencion.py; else echo "Se mantiene la del día"; fi

      - name: Bot de Telegram (porra)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_bot.py

      - name: Guardar datos en el repo
        run: |
          git config user.name "panel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "datos $(date -u +%Y-%m-%dT%H:%M)" && git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Marcar en rojo si las encuestas no pasaron la validación
        if: steps.encuestas.outcome == 'failure'
        run: |
          echo "La lectura de encuestas falló la validación. La web sigue publicada con los datos anteriores. Revisa el paso Encuestas."
          exit 1

  # El cron de GitHub se salta ejecuciones cuando la cola va cargada. Este job espera 55 minutos
  # y vuelve a lanzar el workflow, así la cadena se mantiene sola. El cron queda de red de seguridad.
  encadenar:
    needs: actualizar
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Esperar y relanzar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 3300
          gh workflow run actualizar.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "No se ha podido encadenar, el cron lo retomará"
